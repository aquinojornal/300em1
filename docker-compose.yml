version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: smuv-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: smuv
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - smuv_pgdata:/var/lib/postgresql/data

volumes:
  smuv_pgdata:
